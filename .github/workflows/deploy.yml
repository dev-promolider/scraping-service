name: Deploy Scraping Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Crear archivo .env de producción
        run: |
          cat > .env << EOF
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL=${{ secrets.OPENAI_MODEL }}
          EOF

      - name: Desplegar archivos al servidor por SCP
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "."
          target: ${{ secrets.PROJECT_PATH }}

      - name: Ejecutar comandos Post-despliegue en el servidor
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ${{ secrets.PROJECT_PATH }}
            # Buscar ejecutable de Python 3.10+ en el servidor (ej. cPanel ea-python310, ea-python311 o /usr/bin/python3)
            PYTHON_BIN=$(which python3.14 python3.12 python3.11 python3.10 /opt/cpanel/ea-python310/root/usr/bin/python3 /opt/cpanel/ea-python311/root/usr/bin/python3 python3 | head -n 1)
            echo "Usando ejecutable de Python: $PYTHON_BIN"
            rm -rf .venv
            $PYTHON_BIN -m venv .venv
            .venv/bin/pip install --upgrade pip
            .venv/bin/pip install fastapi "python-dotenv>=1.2.2" "scrapegraphai>=2.1.6" "uvicorn[standard]>=0.52.1"
            .venv/bin/playwright install chromium || true
            pkill -f uvicorn || true
            nohup .venv/bin/python -m uvicorn scrapegraph_api.api:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &

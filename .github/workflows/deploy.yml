name: Deploy Scraping Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Crear archivo .env de producción
        run: |
          cat > .env << EOF
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL=${{ secrets.OPENAI_MODEL }}
          EOF

      - name: Desplegar archivos al servidor por SCP
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "."
          target: ${{ secrets.PROJECT_PATH }}

      - name: Instalar dependencias en el servidor
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: "15m"
          script: |
            cd ${{ secrets.PROJECT_PATH }}
            PYTHON_BIN=$(which python3.14 python3.12 python3.11 python3.10 python3 2>/dev/null | head -n 1)
            echo "Usando Python: $PYTHON_BIN ($($PYTHON_BIN --version 2>&1))"
            rm -rf .venv
            $PYTHON_BIN -m venv .venv
            .venv/bin/pip install --upgrade pip
            .venv/bin/pip install .
            .venv/bin/playwright install chromium || true

      - name: Reiniciar Uvicorn
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ${{ secrets.PROJECT_PATH }}
            chmod +x restart.sh
            bash restart.sh

